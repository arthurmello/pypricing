name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Full suite on the ArviZ generation current PyMC allows.
          - python-version: "3.11"
            install: pip install -e ".[dev]" "arviz>=0.17,<1"
            command: pytest
          # ArviZ 1.x needs Python >= 3.12. Current PyMC requires arviz<1,
          # so this job checks the compatibility helpers against DataTree.
          - python-version: "3.12"
            install: pip install "arviz>=1,<2" "numpy>=1.24" "pandas>=2" "xarray" "pytest>=7" "netcdf4"
            command: pytest tests/unit/test_arviz_compat.py

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          ${{ matrix.install }}
      - name: Test
        run: ${{ matrix.command }}
